name: render
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "video spec json"
        required: true
      tag:
        description: "release tag"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
          pip install edge-tts pillow
      - name: Render video
        env:
          SPEC: ${{ inputs.spec }}
        run: python render.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" out/video.mp4 out/thumb.jpg out/meta.json --title "$TAG" --notes "ok"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --title "FAILED" --notes "FAILED" || true
